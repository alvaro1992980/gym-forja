name: gym_app
description: "Gym app (members, check-in, training plans)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Libraries from docs/PLAN.md section 5.3. Feature-specific ones (QR, scanner,
# sockets, Firebase, charts, wakelock, share) are added with the deliverable that
# uses them (see docs/DECISIONS.md).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  permission_handler: ^13.0.2
  socket_io_client: ^3.1.6
  wakelock_plus: ^1.8.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  generate: true
