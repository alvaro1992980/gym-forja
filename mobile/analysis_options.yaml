# Static analysis for the Flutter app.
# Base: flutter_lints, plus strict analyzer modes and extra rules.
# `flutter analyze` must report zero issues (see docs/PLAN.md, section 0.8).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/generated/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_build_context_synchronously
    - use_super_parameters
